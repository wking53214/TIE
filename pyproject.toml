[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tie-transcript-intelligence-engine"
version = "0.1.0"
description = "Reconstructed, evidence-preserving Transcript Intelligence Engine foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Optional: lets a TIE package or handoff be named for a CNS verdict (tie.cns_connector). Nothing in TIE imports CNS otherwise.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v1.9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
