[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tie-transcript-intelligence-engine"
version = "0.1.0"
description = "Reconstructed, evidence-preserving Transcript Intelligence Engine foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
# Optional: lets a TIE package or handoff be named for a CNS verdict (tie.cns_connector). Nothing in TIE imports CNS otherwise.
cns = ["cns @ git+https://github.com/wking53214/CNS.git@v4.0.0"]
# Pinned exactly: the recorded baseline in tools/lint_baseline.json depends on these versions.
lint = ["ruff==0.16.9", "mypy==2.3.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
